<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>말씀 묵상 저널</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#FBF6EF;
  --ink:#2A2724;
  --ink-soft:#7A736B;
  --ink-faint:#B3AAA0;
  --rose:#E7B7B9;
  --rose-deep:#3F5670;
  --sage:#A9C2A2;
  --sage-deep:#8A6A2F;
  --lilac:#C9AFCB;
  --lilac-deep:#4F6B8F;
  --amber:#E7C98B;
  --amber-deep:#3B4F68;
  --gold:#C08A2E;
  --paper:#FFFFFF;
  --line:#E9E0D3;
  --shadow:0 14px 34px rgba(42,39,34,.10);
  --shadow-sm:0 4px 14px rgba(42,39,34,.08);
  --radius:18px;
  --surface-strong:#2A2724;
  --badge-blue:#3F5670;
  --badge-gold:#B8791F;
  --bubble-them:#FFFFFF;
}
#shell.theme-dark{
  --bg:#1C1A18;
  --ink:#F6F3EE;
  --ink-soft:#D2CCC3;
  --ink-faint:#A29B8F;
  --rose:#E7B7B9;
  --rose-deep:#9AB3D6;
  --sage:#A9C2A2;
  --sage-deep:#D8B25C;
  --lilac:#C9AFCB;
  --lilac-deep:#9DB6D6;
  --amber:#E7C98B;
  --amber-deep:#8FB0D8;
  --gold:#E0B75C;
  --paper:#28251F;
  --line:#3A362E;
  --shadow:0 14px 34px rgba(0,0,0,.35);
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --surface-strong:#3F5670;
  --bubble-them:#4C5F78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
input::placeholder, textarea::placeholder{color:var(--ink-faint);opacity:1;}
html,body{
  margin:0;padding:0;
  width:100%;
  height:100vh;height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
}
body{
  background:#EFE7DA;
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:24px 10px;
}
#root{
  width:100%;
  max-width:480px;
  height:100%;
  margin:0 auto;
  display:flex;
  justify-content:center;
}
img, canvas{max-width:100%;}
#shell{
  width:100%;
  max-width:412px;
  height:100dvh;
  max-height:892px;
  background:var(--bg);
  color:var(--ink);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  overflow-x:hidden;
  overflow-y:auto;
  position:relative;
  border:1px solid #E3D8C6;
  display:flex;
  flex-direction:column;
}
#app{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;position:relative;}
#shell.fs-small{zoom:0.9;}
#shell.fs-default{zoom:1;}
#shell.fs-large{zoom:1.16;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--rose);color:#fff;}

/* ---------- top bar (main) ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 20px 6px;
}
.topbar .icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);box-shadow:var(--shadow-sm);
  color:var(--ink-soft);
  padding:0;overflow:hidden;flex-shrink:0;
}
.topbar .icon-btn svg{width:22px;height:22px;flex-shrink:0;}
.topbar .icon-btn.active{color:var(--gold);}
.topbar .icon-btn.icon-btn-accent{
  background:var(--badge-blue);color:#fff;box-shadow:0 6px 16px rgba(63,86,112,.35);
}
.topbar .left-group{display:flex;align-items:center;gap:8px;}
.topbar .right-group{display:flex;align-items:center;gap:8px;}
.streak-badge{
  display:flex;align-items:center;gap:5px;background:var(--paper);box-shadow:var(--shadow-sm);
  border-radius:20px;padding:8px 12px 8px 9px;color:#E8791E;flex-shrink:0;
}
.streak-badge svg{width:17px;height:17px;flex-shrink:0;}
.streak-badge .streak-num{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
.year-block{text-align:center;padding:4px 0 18px;}
.year-block .eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;font-size:11px;
  letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;
}
.year-block h1{
  font-family:'Noto Serif KR',serif;font-size:30px;margin:2px 0 0;font-weight:700;
}
.year-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

/* ---------- cover grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:0 16px 28px;
}
.books-list{padding:0 16px 28px;display:flex;flex-direction:column;gap:8px;}
.book-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 18px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow-sm);
  color:var(--ink);min-height:34px;
}
.book-row-name{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;}
.book-row-en{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  font-size:12.5px;color:var(--ink-faint);margin-left:6px;
}
.book-row svg{width:18px;height:18px;color:var(--ink-faint);flex-shrink:0;}
.book-row.locked{color:var(--ink-faint);}
.book-row.colored{color:#5A4A32;box-shadow:var(--shadow-sm);}
.book-row.colored .book-row-name{color:#5A4A32;}
.book-row.colored .book-row-en{color:#8A7A5C;}
.book-row.colored svg{color:#5A4A32;}
.book-row.locked .book-row-name{color:var(--ink-faint);}
.book-row.locked svg{color:var(--ink-faint);}
.book-row:active{transform:scale(.98);}
.cover{
  position:relative;border-radius:12px;overflow:hidden;
  aspect-ratio:3/4.3;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;text-align:left;
  transition:transform .15s ease;
}
.cover:active{transform:scale(.96);}
.cover-top{
  flex:1;background:var(--c-top);padding:9px 8px 6px;
  display:flex;flex-direction:column;gap:4px;position:relative;
}
.cover-top::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:rgba(0,0,0,.08);
}
.cover-eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  font-size:8.6px;line-height:1.25;color:rgba(255,255,255,.92);
  letter-spacing:.01em;
}
.cover-kr{
  margin-top:auto;font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:7.6px;line-height:1.35;color:rgba(255,255,255,.85);
}
.cover-bottom{
  background:var(--c-bottom);padding:6px 8px;
  display:flex;align-items:center;gap:6px;
}
.cover-badge{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:10px;color:var(--ink);
}
.cover-foot{font-size:6.6px;color:rgba(255,255,255,.9);line-height:1.2;}
.lock-overlay{
  position:absolute;inset:0;background:rgba(20,18,16,.46);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#fff;backdrop-filter:blur(.5px);
}
.lock-overlay svg{width:13px;height:13px;}
.lock-overlay span{font-size:8px;font-weight:600;letter-spacing:.02em;}

/* ---------- login screen ---------- */
.screen-center{
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
  padding:56px 30px 32px;overflow-y:auto;
}
.back-fab{
  position:absolute;top:20px;left:18px;width:36px;height:36px;border-radius:50%;
  background:var(--paper);box-shadow:var(--shadow-sm);display:flex;align-items:center;
  justify-content:center;color:var(--ink-soft);z-index:5;
}
.login-mark{text-align:center;margin-bottom:34px;}
.login-mark .eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.login-mark h2{
  font-family:'Noto Serif KR',serif;font-size:24px;margin:6px 0 0;font-weight:700;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);font-size:14px;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--lilac-deep);}
.btn{
  width:100%;padding:14px;border-radius:12px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{background:var(--surface-strong);color:#fff;margin-top:6px;}
.btn-google{background:var(--paper);color:var(--ink);border:1px solid var(--line);margin-top:10px;}
.btn-kakao{background:#FEE500;color:#191919;margin-top:10px;}
.btn-kakao svg{flex-shrink:0;}
.btn-ghost{background:transparent;color:var(--ink-soft);margin-top:14px;text-decoration:underline;text-underline-offset:3px;font-weight:500;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--ink-faint);font-size:11px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

.consent-box{
  background:var(--paper);border-radius:12px;box-shadow:var(--shadow-sm);
  padding:13px 14px;margin-top:8px;
}
.consent-row{display:flex;align-items:flex-start;gap:10px;}
.consent-check{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;
}
.consent-check.checked{background:var(--surface-strong);border-color:var(--surface-strong);color:#fff;}
.consent-check svg{width:11px;height:11px;}
.consent-label{flex:1;font-size:12.5px;font-weight:600;line-height:1.5;}
.consent-view-btn{font-size:11px;color:var(--ink-faint);text-decoration:underline;text-underline-offset:2px;flex-shrink:0;margin-top:1px;}
.consent-detail{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-line;
}

/* ---------- modal / sheet ---------- */
.overlay{
  position:absolute;inset:0;background:rgba(24,20,16,.42);
  display:flex;align-items:flex-end;justify-content:center;z-index:40;
}
.overlay.center{align-items:center;padding:0 22px;}
.sheet{
  width:100%;background:var(--bg);border-radius:22px 22px 0 0;
  padding:22px 22px 26px;box-shadow:0 -10px 30px rgba(0,0,0,.18);
  max-height:80%;overflow-y:auto;
}
.modal-card{
  width:100%;background:var(--paper);border-radius:20px;padding:26px 22px 22px;
  box-shadow:var(--shadow);
}
.sheet-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin:0 0 6px;}
.modal-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;}
.price-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:var(--bg);border-radius:12px;margin-bottom:18px;
}
.price-row .label{font-size:12.5px;color:var(--ink-soft);}
.price-row .amount{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}
.btn-cancel{background:var(--bg);color:var(--ink-soft);}

.plan-options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.plan-option{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);text-align:left;
}
.plan-option.selected{border-color:var(--gold);background:#FBF1DC;}
.plan-option .radio{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.plan-option.selected .radio{border-color:var(--gold);}
.plan-option.selected .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);}
.plan-option .plan-info{flex:1;}
.plan-option .plan-name{font-size:13.5px;font-weight:700;}
.plan-option .plan-desc{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.plan-option .plan-price{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;white-space:nowrap;}
.plan-option .plan-badge{
  display:inline-block;background:var(--badge-blue);color:#fff;font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;
}

/* ---------- calendar screen ---------- */
.cal-header{
  padding:20px 20px 6px;display:flex;align-items:center;gap:12px;
}
.cal-header .icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);flex-shrink:0;
}
.cal-header .titles{flex:1;}
.cal-header .titles .cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.cal-header .titles h2{font-family:'Noto Serif KR',serif;font-size:19px;margin:2px 0 0;font-weight:700;}
.cal-today-strip{
  margin:10px 20px 6px;padding:11px 14px;border-radius:12px;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;
}
.cal-today-strip .t-label{font-size:11px;color:var(--ink-faint);}
.cal-today-strip .t-date{font-family:'Noto Serif KR',serif;font-weight:700;font-size:13.5px;margin-top:2px;}
.cal-today-strip .t-badge{
  background:var(--badge-gold);color:#fff;font-size:10.5px;font-weight:700;
  padding:5px 10px;border-radius:20px;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);padding:14px 16px 4px;
  text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 16px 24px;
}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;position:relative;gap:2px;
}
.cal-cell.empty{visibility:hidden;}
.cal-cell .cal-num{font-size:13.5px;font-weight:600;color:var(--ink);}
.cal-cell .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--rose-deep);}
.cal-cell.is-today{background:var(--surface-strong);}
.cal-cell.is-today .cal-num{color:#fff;}
.cal-cell.is-today .cal-dot{background:var(--gold);}
.cal-cell:active{transform:scale(.94);}
.cal-legend{
  display:flex;align-items:center;gap:6px;padding:0 20px 10px;font-size:11px;color:var(--ink-faint);
}
.cal-legend .dot{width:5px;height:5px;border-radius:50%;background:var(--rose-deep);}

.chap-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
}
.chap-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;position:relative;gap:3px;background:var(--paper);box-shadow:var(--shadow-sm);
}
.chap-cell .chap-num{font-size:14px;font-weight:700;color:var(--ink);font-family:'Noto Serif KR',serif;}
.chap-cell .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--rose-deep);}
.chap-cell svg{width:12px;height:12px;color:#5B7A55;}
.chap-cell.complete{background:#E4F1E1;border:1px solid #A9C2A2;}
.chap-cell.complete .chap-num{color:#3F5A3A;}
#shell.theme-dark .chap-cell.complete{background:#2E3B2A;border-color:#4C6248;}
#shell.theme-dark .chap-cell.complete .chap-num{color:#C7E0C0;}
#shell.theme-dark .chap-cell.complete svg{color:#8FBF85;}
.chap-cell:active{transform:scale(.94);}

/* ---------- daily view ---------- */
.daily-header{
  padding:20px 20px 14px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.daily-header .icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);flex-shrink:0;
}
.daily-header .titles{flex:1;}
.daily-header .titles .cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.daily-header .titles h2{font-family:'Noto Serif KR',serif;font-size:17px;margin:2px 0 0;font-weight:700;}

.tab-content{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 90px;}

/* bible tab */
.chapter-card{
  background:var(--paper);border-radius:16px;padding:18px 18px 6px;box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}
.chapter-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.chapter-card .cap{font-size:10.5px;color:var(--gold);letter-spacing:.08em;font-weight:700;text-transform:uppercase;}
.chapter-card h3{font-family:'Noto Serif KR',serif;font-size:20px;margin:6px 0 2px;}
.chapter-card .note{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px;}
.verse-list{display:flex;flex-direction:column;}
.verse{
  display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.6;transition:background .5s ease;
  border-radius:8px;scroll-margin-top:100px;
}
.verse .vnum{
  font-family:'Noto Serif KR',serif;font-weight:700;color:var(--ink-faint);
  font-size:12px;width:20px;flex-shrink:0;padding-top:1px;
}
.verse.highlight{background:#FBEFCB;}

/* content questions tab */
.q-card{
  background:var(--paper);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);
  margin-bottom:12px;
}
.q-ref{
  display:inline-flex;align-items:center;gap:4px;background:var(--bg);
  color:var(--lilac-deep);font-weight:700;font-size:11.5px;padding:5px 10px;
  border-radius:20px;margin-bottom:9px;border:1px solid var(--line);
}
.q-ref svg{width:11px;height:11px;}
.q-text{font-size:13.5px;line-height:1.55;margin-bottom:10px;font-weight:500;}
.q-answer{
  width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);padding:10px 12px;font-size:13px;font-family:inherit;
  resize:vertical;outline:none;color:var(--ink);
}
.q-answer:focus{border-color:var(--lilac-deep);}

/* thought tab */
.section-block{margin-bottom:18px;}
.section-block .s-label{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
  margin-bottom:8px;font-family:'Noto Serif KR',serif;
}
.section-block .s-label .dot{width:6px;height:6px;border-radius:50%;background:var(--rose-deep);flex-shrink:0;}
.section-block textarea, .section-block input[type=text]{
  width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  padding:11px 12px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;
}
.section-block textarea{min-height:58px;resize:vertical;box-shadow:var(--shadow-sm);}
.section-block input[type=text]{box-shadow:var(--shadow-sm);}
.thanks-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.thanks-row .num{
  width:20px;height:20px;border-radius:50%;background:var(--sage);color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

.ask-box{background:var(--paper);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.ask-row{
  display:flex;align-items:center;gap:10px;padding:12px 13px;justify-content:space-between;
}
.ask-row .ask-q{font-size:13px;font-weight:600;line-height:1.45;flex:1;}
.ask-arrow{
  width:28px;height:28px;border-radius:50%;background:var(--bg);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  transition:transform .2s ease;
}
.ask-arrow.open{transform:rotate(180deg);}
.ask-list{border-top:1px solid var(--line);}
.ask-item{
  padding:11px 13px;font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);
  color:var(--ink-soft);
}

.journal-card{

}

}

.bottom-nav{

.toast{

}

/* ---------- settings screen (full page) ---------- */
.settings-header{
  padding:20px 20px 14px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.settings-header .icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);

  color:var(--ink-soft);flex-shrink:0;
}
.settings-header h2{font-family:'Noto Serif KR',serif;font-size:19px;margin:0;font-weight:700;}

}

}

}

  content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;

}

}

}

}

}

.snap-card{

.snap-footer{

}
