<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀 묵상 저널</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --bg:#FBF6EF;
  --ink:#2A2724;
  --ink-soft:#7A736B;
  --ink-faint:#B3AAA0;
  --rose:#E7B7B9;
  --rose-deep:#3F5670;
  --sage:#A9C2A2;
  --sage-deep:#8A6A2F;
  --lilac:#C9AFCB;
  --lilac-deep:#4F6B8F;
  --amber:#E7C98B;
  --amber-deep:#3B4F68;
  --gold:#C08A2E;
  --paper:#FFFFFF;
  --line:#E9E0D3;
  --shadow:0 14px 34px rgba(42,39,34,.10);
  --shadow-sm:0 4px 14px rgba(42,39,34,.08);
  --radius:18px;
  --surface-strong:#2A2724;
  --badge-blue:#3F5670;
  --badge-gold:#B8791F;
  --bubble-them:#FFFFFF;
}
#shell.theme-dark{
  --bg:#1C1A18;
  --ink:#F6F3EE;
  --ink-soft:#D2CCC3;
  --ink-faint:#A29B8F;
  --rose:#E7B7B9;
  --rose-deep:#9AB3D6;
  --sage:#A9C2A2;
  --sage-deep:#D8B25C;
  --lilac:#C9AFCB;
  --lilac-deep:#9DB6D6;
  --amber:#E7C98B;
  --amber-deep:#8FB0D8;
  --gold:#E0B75C;
  --paper:#28251F;
  --line:#3A362E;
  --shadow:0 14px 34px rgba(0,0,0,.35);
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --surface-strong:#3F5670;
  --bubble-them:#4C5F78;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
input::placeholder, textarea::placeholder{color:var(--ink-faint);opacity:1;}
html,body{margin:0;padding:0;}
body{
  background:#EFE7DA;
  font-family:'Noto Sans KR',sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
  padding:24px 10px;
}
#shell{
  width:100%;
  max-width:412px;
  min-height:820px;
  background:var(--bg);
  color:var(--ink);
  border-radius:34px;
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  border:1px solid #E3D8C6;
  display:flex;
  flex-direction:column;
}
#app{flex:1;display:flex;flex-direction:column;min-height:820px;position:relative;}
#shell.fs-small{zoom:0.9;}
#shell.fs-default{zoom:1;}
#shell.fs-large{zoom:1.16;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--rose);color:#fff;}

/* ---------- top bar (main) ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 20px 6px;
}
.topbar .icon-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);box-shadow:var(--shadow-sm);
  color:var(--ink-soft);
}
.topbar .icon-btn.active{color:var(--gold);}
.topbar .icon-btn.icon-btn-accent{
  background:var(--badge-blue);color:#fff;box-shadow:0 6px 16px rgba(63,86,112,.35);
}
.topbar .left-group{display:flex;align-items:center;gap:8px;}
.topbar .right-group{display:flex;align-items:center;gap:8px;}
.streak-badge{
  display:flex;align-items:center;gap:5px;background:var(--paper);box-shadow:var(--shadow-sm);
  border-radius:20px;padding:8px 12px 8px 9px;color:#E8791E;flex-shrink:0;
}
.streak-badge svg{width:17px;height:17px;flex-shrink:0;}
.streak-badge .streak-num{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
.year-block{text-align:center;padding:4px 0 18px;}
.year-block .eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;font-size:11px;
  letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;
}
.year-block h1{
  font-family:'Noto Serif KR',serif;font-size:30px;margin:2px 0 0;font-weight:700;
}
.year-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

/* ---------- cover grid ---------- */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:0 16px 28px;
}
.books-list{padding:0 16px 28px;display:flex;flex-direction:column;gap:8px;}
.book-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 18px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow-sm);
  color:var(--ink);min-height:34px;
}
.book-row-name{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;}
.book-row-en{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  font-size:12.5px;color:var(--ink-faint);margin-left:6px;
}
.book-row svg{width:18px;height:18px;color:var(--ink-faint);flex-shrink:0;}
.book-row.locked{color:var(--ink-faint);}
.book-row.colored{color:#5A4A32;box-shadow:var(--shadow-sm);}
.book-row.colored .book-row-name{color:#5A4A32;}
.book-row.colored .book-row-en{color:#8A7A5C;}
.book-row.colored svg{color:#5A4A32;}
.book-row.locked .book-row-name{color:var(--ink-faint);}
.book-row.locked svg{color:var(--ink-faint);}
.book-row:active{transform:scale(.98);}
.cover{
  position:relative;border-radius:12px;overflow:hidden;
  aspect-ratio:3/4.3;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;text-align:left;
  transition:transform .15s ease;
}
.cover:active{transform:scale(.96);}
.cover-top{
  flex:1;background:var(--c-top);padding:9px 8px 6px;
  display:flex;flex-direction:column;gap:4px;position:relative;
}
.cover-top::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:rgba(0,0,0,.08);
}
.cover-eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  font-size:8.6px;line-height:1.25;color:rgba(255,255,255,.92);
  letter-spacing:.01em;
}
.cover-kr{
  margin-top:auto;font-family:'Noto Serif KR',serif;font-weight:600;
  font-size:7.6px;line-height:1.35;color:rgba(255,255,255,.85);
}
.cover-bottom{
  background:var(--c-bottom);padding:6px 8px;
  display:flex;align-items:center;gap:6px;
}
.cover-badge{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:10px;color:var(--ink);
}
.cover-foot{font-size:6.6px;color:rgba(255,255,255,.9);line-height:1.2;}
.lock-overlay{
  position:absolute;inset:0;background:rgba(20,18,16,.46);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#fff;backdrop-filter:blur(.5px);
}
.lock-overlay svg{width:13px;height:13px;}
.lock-overlay span{font-size:8px;font-weight:600;letter-spacing:.02em;}

/* ---------- login screen ---------- */
.screen-center{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:56px 30px 32px;overflow-y:auto;
}
.back-fab{
  position:absolute;top:20px;left:18px;width:36px;height:36px;border-radius:50%;
  background:var(--paper);box-shadow:var(--shadow-sm);display:flex;align-items:center;
  justify-content:center;color:var(--ink-soft);z-index:5;
}
.login-mark{text-align:center;margin-bottom:34px;}
.login-mark .eyebrow{
  font-family:'Playfair Display',serif;font-style:italic;color:var(--ink-faint);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.login-mark h2{
  font-family:'Noto Serif KR',serif;font-size:24px;margin:6px 0 0;font-weight:700;
}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);font-size:14px;color:var(--ink);outline:none;
}
.field input:focus{border-color:var(--lilac-deep);}
.btn{
  width:100%;padding:14px;border-radius:12px;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{background:var(--surface-strong);color:#fff;margin-top:6px;}
.btn-google{background:var(--paper);color:var(--ink);border:1px solid var(--line);margin-top:10px;}
.btn-kakao{background:#FEE500;color:#191919;margin-top:10px;}
.btn-kakao svg{flex-shrink:0;}
.btn-ghost{background:transparent;color:var(--ink-soft);margin-top:14px;text-decoration:underline;text-underline-offset:3px;font-weight:500;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--ink-faint);font-size:11px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

.consent-box{
  background:var(--paper);border-radius:12px;box-shadow:var(--shadow-sm);
  padding:13px 14px;margin-top:8px;
}
.consent-row{display:flex;align-items:flex-start;gap:10px;}
.consent-check{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px;
}
.consent-check.checked{background:var(--surface-strong);border-color:var(--surface-strong);color:#fff;}
.consent-check svg{width:11px;height:11px;}
.consent-label{flex:1;font-size:12.5px;font-weight:600;line-height:1.5;}
.consent-view-btn{font-size:11px;color:var(--ink-faint);text-decoration:underline;text-underline-offset:2px;flex-shrink:0;margin-top:1px;}
.consent-detail{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-line;
}

/* ---------- modal / sheet ---------- */
.overlay{
  position:absolute;inset:0;background:rgba(24,20,16,.42);
  display:flex;align-items:flex-end;justify-content:center;z-index:40;
}
.overlay.center{align-items:center;padding:0 22px;}
.sheet{
  width:100%;background:var(--bg);border-radius:22px 22px 0 0;
  padding:22px 22px 26px;box-shadow:0 -10px 30px rgba(0,0,0,.18);
  max-height:80%;overflow-y:auto;
}
.modal-card{
  width:100%;background:var(--paper);border-radius:20px;padding:26px 22px 22px;
  box-shadow:var(--shadow);
}
.sheet-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin:0 0 6px;}
.modal-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;}
.price-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:var(--bg);border-radius:12px;margin-bottom:18px;
}
.price-row .label{font-size:12.5px;color:var(--ink-soft);}
.price-row .amount{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;}
.btn-cancel{background:var(--bg);color:var(--ink-soft);}

.plan-options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.plan-option{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);text-align:left;
}
.plan-option.selected{border-color:var(--gold);background:#FBF1DC;}
.plan-option .radio{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.plan-option.selected .radio{border-color:var(--gold);}
.plan-option.selected .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);}
.plan-option .plan-info{flex:1;}
.plan-option .plan-name{font-size:13.5px;font-weight:700;}
.plan-option .plan-desc{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.plan-option .plan-price{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;white-space:nowrap;}
.plan-option .plan-badge{
  display:inline-block;background:var(--badge-blue);color:#fff;font-size:9px;font-weight:700;
  padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:middle;
}

/* ---------- calendar screen ---------- */
.cal-header{
  padding:20px 20px 6px;display:flex;align-items:center;gap:12px;
}
.cal-header .icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);flex-shrink:0;
}
.cal-header .titles .cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.cal-header .titles h2{font-family:'Noto Serif KR',serif;font-size:19px;margin:2px 0 0;font-weight:700;}
.cal-today-strip{
  margin:10px 20px 6px;padding:11px 14px;border-radius:12px;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;
}
.cal-today-strip .t-label{font-size:11px;color:var(--ink-faint);}
.cal-today-strip .t-date{font-family:'Noto Serif KR',serif;font-weight:700;font-size:13.5px;margin-top:2px;}
.cal-today-strip .t-badge{
  background:var(--badge-gold);color:#fff;font-size:10.5px;font-weight:700;
  padding:5px 10px;border-radius:20px;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);padding:14px 16px 4px;
  text-align:center;font-size:11px;color:var(--ink-faint);font-weight:600;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 16px 24px;
}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;position:relative;gap:2px;
}
.cal-cell.empty{visibility:hidden;}
.cal-cell .cal-num{font-size:13.5px;font-weight:600;color:var(--ink);}
.cal-cell .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--rose-deep);}
.cal-cell.is-today{background:var(--surface-strong);}
.cal-cell.is-today .cal-num{color:#fff;}
.cal-cell.is-today .cal-dot{background:var(--gold);}
.cal-cell:active{transform:scale(.94);}
.cal-legend{
  display:flex;align-items:center;gap:6px;padding:0 20px 10px;font-size:11px;color:var(--ink-faint);
}
.cal-legend .dot{width:5px;height:5px;border-radius:50%;background:var(--rose-deep);}

.chap-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
}
.chap-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;position:relative;gap:3px;background:var(--paper);box-shadow:var(--shadow-sm);
}
.chap-cell .chap-num{font-size:14px;font-weight:700;color:var(--ink);font-family:'Noto Serif KR',serif;}
.chap-cell .cal-dot{width:4px;height:4px;border-radius:50%;background:var(--rose-deep);}
.chap-cell svg{width:12px;height:12px;color:#5B7A55;}
.chap-cell.complete{background:#E4F1E1;border:1px solid #A9C2A2;}
.chap-cell.complete .chap-num{color:#3F5A3A;}
#shell.theme-dark .chap-cell.complete{background:#2E3B2A;border-color:#4C6248;}
#shell.theme-dark .chap-cell.complete .chap-num{color:#C7E0C0;}
#shell.theme-dark .chap-cell.complete svg{color:#8FBF85;}
.chap-cell:active{transform:scale(.94);}

/* ---------- daily view ---------- */
.daily-header{
  padding:20px 20px 14px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.daily-header .icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--paper);
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);flex-shrink:0;
}
.daily-header .titles{flex:1;}
.daily-header .titles .cap{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.daily-header .titles h2{font-family:'Noto Serif KR',serif;font-size:17px;margin:2px 0 0;font-weight:700;}

.tab-content{flex:1;overflow-y:auto;padding:18px 20px 90px;}

/* bible tab */
.chapter-card{
  background:var(--paper);border-radius:16px;padding:18px 18px 6px;box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}
.chapter-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.chapter-info-btn{
  width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--ink-faint);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
}
.chapter-info-btn svg{width:18px;height:18px;}
.chapter-card .cap{font-size:10.5px;color:var(--gold);letter-spacing:.08em;font-weight:700;text-transform:uppercase;}
.chapter-card h3{font-family:'Noto Serif KR',serif;font-size:20px;margin:6px 0 2px;}
.chapter-card .note{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px;}
.verse-list{display:flex;flex-direction:column;}
.verse{
  display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.6;transition:background .5s ease;
  border-radius:8px;scroll-margin-top:100px;
}
.verse .vnum{
  font-family:'Noto Serif KR',serif;font-weight:700;color:var(--ink-faint);
  font-size:12px;width:20px;flex-shrink:0;padding-top:1px;
}
.verse.highlight{background:#FBEFCB;}

/* content questions tab */
.q-card{
  background:var(--paper);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);
  margin-bottom:12px;
}
.q-ref{
  display:inline-flex;align-items:center;gap:4px;background:var(--bg);
  color:var(--lilac-deep);font-weight:700;font-size:11.5px;padding:5px 10px;
  border-radius:20px;margin-bottom:9px;border:1px solid var(--line);
}
.q-ref svg{width:11px;height:11px;}
.q-text{font-size:13.5px;line-height:1.55;margin-bottom:10px;font-weight:500;}
.q-answer{
  width:100%;min-height:64px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);padding:10px 12px;font-size:13px;font-family:inherit;
  resize:vertical;outline:none;color:var(--ink);
}
.q-answer:focus{border-color:var(--lilac-deep);}

/* thought tab */
.section-block{margin-bottom:18px;}
.section-block .s-label{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
  margin-bottom:8px;font-family:'Noto Serif KR',serif;
}
.section-block .s-label .dot{width:6px;height:6px;border-radius:50%;background:var(--rose-deep);flex-shrink:0;}
.section-block textarea, .section-block input[type=text]{
  width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  padding:11px 12px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;
}
.section-block textarea{min-height:58px;resize:vertical;box-shadow:var(--shadow-sm);}
.section-block input[type=text]{box-shadow:var(--shadow-sm);}
.thanks-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.thanks-row .num{
  width:20px;height:20px;border-radius:50%;background:var(--sage);color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

.ask-box{background:var(--paper);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
.ask-row{
  display:flex;align-items:center;gap:10px;padding:12px 13px;justify-content:space-between;
}
.ask-row .ask-q{font-size:13px;font-weight:600;line-height:1.45;flex:1;}
.ask-arrow{
  width:28px;height:28px;border-radius:50%;background:var(--bg);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  transition:transform .2s ease;
}
.ask-arrow.open{transform:rotate(180deg);}
.ask-list{border-top:1px solid var(--line);}
.ask-item{
  padding:11px 13px;font-size:12.5px;line-height:1.5;border-top:1px solid var(--line);
  color:var(--ink-soft);
}
.ask-item:first-child{border-top:none;}
.ask-item.selected{background:#FBEFCB;color:var(--ink);font-weight:600;}
.ask-answer-wrap{padding:10px 13px 14px;}
.add-thanks-btn{
  display:flex;align-items:center;gap:6px;justify-content:center;
  width:100%;padding:10px;border-radius:10px;border:1.5px dashed var(--line);

      const provider = new OAuthProvider('oidc.kakao');

      return toProfile(result.user);
    },
    signUpWithEmail: async (email, password, displayName)=>{
      if(!auth) throw new Error('firebase-not-configured');
      const result = await createUserWithEmailAndPassword(auth, email, password);
      if(displayName){
        try{ await updateProfile(result.user, { displayName }); }catch(e){}
      }
      return toProfile(result.user);
    },
    signInWithEmail: async (email, password)=>{
      if(!auth) throw new Error('firebase-not-configured');
      const result = await signInWithEmailAndPassword(auth, email, password);

    signOutOfGoogle: async ()=>{
      if(auth) await signOut(auth);
    },
    onChange: (cb)=>{
      if(!auth) return;
      onAuthStateChanged(auth, (u)=>{
        if(u) cb(toProfile(u));
        else cb(null);
      });
    }
  };

  window.__firebaseDB = {
    ready: !!db,
    saveUserProfile: async (uid, data)=>{
      if(!db) throw new Error('firebase-not-configured');
      await setDoc(doc(db, 'users', uid), { ...data, updatedAt: serverTimestamp() }, { merge:true });
    },
    getUserProfile: async (uid)=>{
      if(!db) throw new Error('firebase-not-configured');
      const snap = await getDoc(doc(db, 'users', uid));
      return snap.exists() ? snap.data() : null;

  };

/* simulate group members reading a message I sent, ticking the unread count down to 0 */
function scheduleReadTicks(g, msg){
  if(!g || !msg || !msg.isMe || !(msg.unread>0)) return;
  const delay = 1200 + Math.random()*2600;
  setTimeout(()=>{
    if(msg.unread>0){
      msg.unread -= 1;
      saveGroups();
      if(state.screen==='group-room' && state.activeGroupId===g.id) render();
      scheduleReadTicks(g, msg);
    }
  }, delay);
}
function resumeAllReadTicks(){
  groups.forEach(g=>{
    (g.messages||[]).forEach(msg=>{
      if(msg.isMe && msg.unread>0) scheduleReadTicks(g, msg);
    });
  });
}
function pushMyMessage(g, msg){
  msg.unread = Math.max(0, (g.memberCount||1) - 1);
  g.messages.push(msg);
  saveGroups();
  scheduleReadTicks(g, msg);
}

function blankEntry(){
  return { content:{}, thought:{ verse:'', passage:'', godIs:'', askIndex:null, heard:'', application:'', prayer:'', thanks:['','',''] } };
}
function getEntry(dateStr){
  if(!journalData[dateStr]) journalData[dateStr] = blankEntry();
  return journalData[dateStr];
}
function hasEntryContent(dStr){
  const e = journalData[dStr];
  if(!e) return false;
  const c = Object.values(e.content||{}).some(v=>v && v.trim());
  const t = e.thought||{};
  const th = ['verse','passage','godIs','heard','application','prayer'].some(k=>t[k] && t[k].trim())
    || (t.askIndex!==null && t.askIndex!==undefined)
    || (t.thanks||[]).some(v=>v && v.trim());
  return c || th;
}
function isBookComplete(m){
  const prefix = `${YEAR}-${pad(m)}-`;
  return Object.keys(journalData).some(k=>k.startsWith(prefix) && hasEntryContent(k));
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dstr(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function computeStreak(){
  return Object.keys(journalData).filter(k => hasEntryContent(k)).length;
}

function ensureHtml2Canvas(){
  return new Promise((resolve, reject)=>{
    if(window.html2canvas) return resolve();
    let tries = 0;
    const iv = setInterval(()=>{
      tries++;
      if(window.html2canvas){ clearInterval(iv); resolve(); }
      else if(tries>60){ clearInterval(iv); reject(new Error('html2canvas failed to load')); }
    }, 100);
  });
}
async function captureSnapshotImage(innerHTML){
  await ensureHtml2Canvas();
  const holder = document.createElement('div');
  holder.innerHTML = innerHTML;
  document.body.appendChild(holder);
  const target = holder.querySelector('#snap-render-target');
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
  }catch(e){}
  const canvas = await window.html2canvas(target, {backgroundColor:'#FBF6EF', scale:2, useCORS:true});
  const dataUrl = canvas.toDataURL('image/png');
  document.body.removeChild(holder);
  return dataUrl;
}

function triggerImageDownload(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* Opens the device's mail app via mailto:. If nothing responds within ~1.5s
   (no app switch / tab hide happened), assume no mail client is installed and
   fall back to the Play Store / App Store listing for Gmail (or Gmail's web
   compose page on desktop, where there's no app store to fall back to). */
function openEmailContact(email, subject, body){
  const mailto = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  let handled = false;
  const markHandled = ()=>{ handled = true; };
  window.addEventListener('blur', markHandled, { once:true });
  document.addEventListener('visibilitychange', function onVis(){
    if(document.hidden){ markHandled(); document.removeEventListener('visibilitychange', onVis); }
  });

  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  document.body.appendChild(iframe);
  try{ iframe.contentWindow.location.href = mailto; }catch(e){ window.location.href = mailto; }

  setTimeout(()=>{
    if(iframe.parentNode) document.body.removeChild(iframe);
    if(handled) return;
    const ua = navigator.userAgent || '';
    if(/android/i.test(ua)){
      window.location.href = 'https://play.google.com/store/apps/details?id=com.google.android.gm';
    } else if(/iphone|ipad|ipod/i.test(ua)){
      window.location.href = 'https://apps.apple.com/app/gmail-email-by-google/id422689480';
    } else {
      window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`, '_blank');
    }
  }, 1500);
}

/* Tries the native share sheet (where KakaoTalk shows up as an option on mobile).
   Returns true if the native sheet was shown, false if unsupported so callers can fall back. */
async function shareImageNative(dataUrl, filename, title){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], filename, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title });
      return true;
    }
  }catch(e){
    if(e && e.name==='AbortError') return true; // user cancelled the native sheet themselves
    console.error('Native share failed:', e);
  }
  return false;
}

/* ---------------- persistence ---------------- */
async function loadAll(){
  try{
    const p = await window.storage.get('purchased-months');
    if(p) state.purchased = JSON.parse(p.value);
  }catch(e){}
  let migrated = null;
  try{
    migrated = await window.storage.get('lock-9-12-v1');
  }catch(e){
    migrated = null; // key doesn't exist yet -> not migrated
  }
  if(!migrated){
    state.purchased = state.purchased.filter(m=>m<=8);
    if(state.purchased.length===0) state.purchased = [1,2,3,4,5,6,7,8];
    savePurchased();
    try{ await window.storage.set('lock-9-12-v1', '1', false); }catch(e){}
  }
  let booksMigrated = null;
  try{
    booksMigrated = await window.storage.get('books-v1-migration');
  }catch(e){
    booksMigrated = null;
  }
  if(!booksMigrated){
    state.purchased = [1,2,3];
    savePurchased();
    try{ await window.storage.set('books-v1-migration', '1', false); }catch(e){}
  }
  let freeMigrated = null;
  try{
    freeMigrated = await window.storage.get('free-v1-migration');
  }catch(e){
    freeMigrated = null;
  }
  if(!freeMigrated){
    state.purchased = [1,2,3,4,5];
    savePurchased();
    try{ await window.storage.set('free-v1-migration', '1', false); }catch(e){}
  }
  try{
    const a = await window.storage.get('journal-entries');
    if(a) journalData = JSON.parse(a.value);
  }catch(e){}
  try{
    const l = await window.storage.get('auth-state');
    if(l) state.loggedIn = JSON.parse(l.value).loggedIn;
  }catch(e){}
  try{
    const g = await window.storage.get('groups-data');
    groups = g ? JSON.parse(g.value) : seedGroups();
  }catch(e){
    groups = seedGroups();
  }
  groups.forEach(g=>{ if(!g.memberCount) g.memberCount = 3; });
  resumeAllReadTicks();
  try{
    const pr = await window.storage.get('app-prefs');
    if(pr){
      const parsed = JSON.parse(pr.value);
      if(parsed.fontSize) state.fontSize = parsed.fontSize;
      if(parsed.lang) state.lang = parsed.lang;
      if(parsed.theme) state.theme = parsed.theme;
    }
  }catch(e){}
  try{
    const nf = await window.storage.get('notif-settings');
    if(nf) notifSettings = Object.assign(notifSettings, JSON.parse(nf.value));
  }catch(e){}
  groupsLoaded = true;
  render();
}
function savePrefs(){
  window.storage.set('app-prefs', JSON.stringify({fontSize:state.fontSize, lang:state.lang, theme:state.theme}), false).catch(()=>{});
}
function saveNotifSettings(){
  window.storage.set('notif-settings', JSON.stringify(notifSettings), false).catch(()=>{});
}
function savePurchased(){
  window.storage.set('purchased-months', JSON.stringify(state.purchased), false).catch(()=>{});
}
function saveAuth(){
  window.storage.set('auth-state', JSON.stringify({loggedIn:state.loggedIn}), false).catch(()=>{});
}
function saveGroups(){
  window.storage.set('groups-data', JSON.stringify(groups), false).catch(()=>{});
}
function saveAnswersDebounced(){

  saveTimer = setTimeout(()=>{
    window.storage.set('journal-entries', JSON.stringify(journalData), false).catch(()=>{});
  }, 450);
}

/* ---------------- helpers ---------------- */
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function todayLabel(){
  const d = new Date();
  const days=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

/* ---------------- render root ---------------- */
function render(){
  const shell = document.getElementById('shell');
  shell.className = 'fs-' + state.fontSize + ' theme-' + state.theme;

  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='main') html = renderMain();
  else if(state.screen==='login') html = renderLogin();
  else if(state.screen==='signup') html = renderSignupScreen();
  else if(state.screen==='chapters') html = renderChapterGrid();
  else if(state.screen==='daily') html = renderDaily();
  else if(state.screen==='groups') html = renderGroupsList();
  else if(state.screen==='group-room') html = renderGroupRoom();
  else if(state.screen==='settings') html = renderSettingsScreen();
  else if(state.screen==='contact') html = renderContactScreen();
  else if(state.screen==='guide') html = renderGuideScreen();
  else if(state.screen==='notifications') html = renderNotificationsScreen();

  let overlays = '';
  if(state.purchaseModal) overlays += renderPurchaseModal();
  if(state.createGroupOpen) overlays += renderCreateGroupSheet();
  if(state.inviteGroupId) overlays += renderInviteSheet();
  if(state.shareGroupId) overlays += renderSharePicker();
  if(state.imageViewer) overlays += renderImageViewer();
  if(state.chapterInfoOpen) overlays += renderChapterInfoSheet();
  if(state.notifDayOpen) overlays += renderNotifDaySheet();
  if(state.pageShare) overlays += renderPageShareSheet();

  app.innerHTML = html + overlays + `<div class="toast" id="toast"></div>`;

  if(state.screen==='daily' && state.activeTab==='bible' && state.highlightVerse){
    requestAnimationFrame(()=>{
      const el = document.getElementById('verse-'+state.highlightVerse);
      if(el){
        el.scrollIntoView({block:'center', behavior:'smooth'});
        el.classList.add('highlight');
      }
    });
  }
  if(state.screen==='group-room'){
    const cs = document.getElementById('chat-scroll');
    if(cs) cs.scrollTop = cs.scrollHeight;
  }
}

function renderGroupRoom(){
  const g = getGroup(state.activeGroupId);
  if(!g){
    return `<div class="groups-header"><button class="icon-btn" data-action="go-groups">${ICON.back}</button></div>`;
  }
  const bubbles = g.messages.map(m=>{
    const badge = (m.isMe && m.unread>0) ? `<span class="msg-unread">${m.unread}</span>` : '';
    if(m.type==='system'){
      return `<div class="msg-row system"><div class="msg-bubble">${m.text}</div></div>`;
    }
    if(m.type==='journal'){
      return `
      <div class="msg-row ${m.isMe?'me':'them'}">
        ${!m.isMe ? `<div class="msg-sender">${m.from}</div>` : ''}
        <div class="msg-line">
          ${badge}
          <div class="journal-card">
            <div class="jc-cap">공유된 묵상 · ${m.dateLabel}</div>
            <div class="jc-title">${m.jTitle}</div>
            <div class="jc-text">${m.jText}</div>
          </div>
        </div>
      </div>`;
    }
    if(m.type==='image'){
      return `
      <div class="msg-row ${m.isMe?'me':'them'}">
        ${!m.isMe ? `<div class="msg-sender">${m.from}</div>` : ''}
        <div class="msg-line">
          ${badge}
          <div class="snap-img-wrap">
            <img class="shared-snap-img" src="${m.imageData}" alt="${m.jTitle||''}" data-action="open-image-viewer" data-msgid="${m.id}" data-index="0">
            <div class="snap-img-cap">${m.jTitle||''}</div>
          </div>
        </div>
      </div>`;
    }
    if(m.type==='image-pair'){
      return `
      <div class="msg-row ${m.isMe?'me':'them'}">
        ${!m.isMe ? `<div class="msg-sender">${m.from}</div>` : ''}
        <div class="msg-line">
          ${badge}
          <div class="snap-img-pair-wrap">
            <div class="snap-img-pair">
              ${m.images.map((img,i)=>`
                <img class="shared-snap-img-half" src="${img.dataUrl}" alt="${img.cap||''}" data-action="open-image-viewer" data-msgid="${m.id}" data-index="${i}">
              `).join('')}
            </div>
            <div class="snap-img-cap">${m.jTitle||''}</div>
          </div>
        </div>
      </div>`;
    }
    return `
      <div class="msg-row ${m.isMe?'me':'them'}">
        ${!m.isMe ? `<div class="msg-sender">${m.from}</div>` : ''}
        <div class="msg-line">
          ${badge}
          <div class="msg-bubble">${m.text}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="room-header">
      <button class="icon-btn" data-action="go-groups">${ICON.back}</button>
      <div class="r-avatar" style="background:${g.color}">${g.name.slice(0,1)}</div>
      <div class="titles">
        <h2>${g.name}</h2>
        <div class="cap">${g.messages.length}개 대화</div>
      </div>
      <button class="invite-btn" data-action="open-invite" data-id="${g.id}">${ICON.link}</button>
    </div>
    <div class="chat-scroll" id="chat-scroll">${bubbles}</div>
    <div class="compose-bar">
      <button class="share-journal-btn" data-action="open-share-picker" data-id="${g.id}" title="${T('todayNavTitle')}">${ICON.book}</button>
      <input type="text" id="chat-input" placeholder="메시지를 입력하세요" data-action-enter="send-message" data-id="${g.id}">
      <button class="send-btn" data-action="send-message" data-id="${g.id}">${ICON.send}</button>

  `;
}

/* ---------------- full-screen image viewer ---------------- */
function findMessageById(msgId){
  for(const g of groups){
    const m = (g.messages||[]).find(x=>x.id===msgId);
    if(m) return { g, m };
  }
  return null;
}
function renderImageViewer(){
  const { msgId, index } = state.imageViewer;
  const found = findMessageById(msgId);
  if(!found) return '';
  const { m } = found;
  const images = m.type==='image-pair' ? m.images : [{ dataUrl:m.imageData, cap:m.jTitle }];
  const i = Math.max(0, Math.min(index, images.length-1));
  const cur = images[i];

  return `
  <div class="image-viewer">
    <div class="viewer-topbar">
      <div class="cap">${cur.cap||''}</div>
      <button class="viewer-close" data-action="close-image-viewer">${ICON.close}</button>
    </div>
    <div class="viewer-body">
      <img src="${cur.dataUrl}" alt="${cur.cap||''}">
      ${images.length>1 && i>0 ? `<button class="viewer-nav prev" data-action="viewer-prev">${ICON.chevRight}</button>` : ''}
      ${images.length>1 && i<images.length-1 ? `<button class="viewer-nav next" data-action="viewer-next">${ICON.chevRight}</button>` : ''}
    </div>
    ${images.length>1 ? `<div class="viewer-dots">${images.map((_,idx)=>`<span class="dot ${idx===i?'active':''}"></span>`).join('')}</div>` : ''}
  </div>`;
}

/* ---------------- events ---------------- */
document.getElementById('shell').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='go-main'){ state.screen='main'; state.purchaseModal=null; render(); }
  else if(action==='go-login'){ state.screen='login'; render(); }
  else if(action==='do-email-login'){
    const val = (id)=> { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    const email = val('login-email');
    const password = val('login-password');
    if(!email || !password){ showToast(T('toastFillAll')); return; }
    if(!(window.__firebaseAuth && window.__firebaseAuth.ready)){ showToast(T('toastFirebaseNotSet')); return; }
    window.__firebaseAuth.signInWithEmail(email, password).then(profile=>{
      window.storage.set('user-profile', JSON.stringify(profile), false).catch(()=>{});
      state.loggedIn = true;
      saveAuth();
      state.screen = 'main';
      render();
      showToast(T('toastLogin'));
    }).catch(err=>{
      console.error('Email sign-in failed:', err);
      showToast(T('toastEmailLoginFailed'));
    });
  }
  else if(action==='do-google-login'){
    if(window.__firebaseAuth && window.__firebaseAuth.ready){
      window.__firebaseAuth.signInWithGoogle().then(profile=>{
        window.storage.set('user-profile', JSON.stringify(profile), false).catch(()=>{});
        if(window.__firebaseDB && window.__firebaseDB.ready){
          window.__firebaseDB.saveUserProfile(profile.uid, { name:profile.name, email:profile.email, photoUrl:profile.photoUrl, provider:'google' }).catch(()=>{});
        }
        state.loggedIn = true;
        saveAuth();
        state.screen = 'main';
        render();
        showToast(T('toastLogin'));
      }).catch(err=>{
        console.error('Google sign-in failed:', err);
        showToast(T('toastGoogleFailed'));
      });
    } else {
      showToast(T('toastFirebaseNotSet'));
    }
  }
  else if(action==='do-kakao-login'){
    if(window.__firebaseAuth && window.__firebaseAuth.ready){
      window.__firebaseAuth.signInWithKakao().then(profile=>{
        window.storage.set('user-profile', JSON.stringify(profile), false).catch(()=>{});
        if(window.__firebaseDB && window.__firebaseDB.ready){
          window.__firebaseDB.saveUserProfile(profile.uid, { name:profile.name, email:profile.email, photoUrl:profile.photoUrl, provider:'kakao' }).catch(()=>{});
        }
        state.loggedIn = true;
        saveAuth();
        state.screen = 'main';
        render();
        showToast(T('toastLogin'));
      }).catch(err=>{
        console.error('Kakao sign-in failed:', err);
        showToast(T('toastKakaoFailed'));
      });
    } else {
      showToast(T('toastFirebaseNotSet'));
    }
  }
  else if(action==='go-signup'){
    state.signupTermsConsent = false;
    state.signupTermsConsentOpen = false;
    state.signupConsent = false;
    state.signupConsentOpen = false;
    state.screen = 'signup';
    render();
  }
  else if(action==='toggle-signup-terms-consent'){
    state.signupTermsConsent = !state.signupTermsConsent;
    render();
  }
  else if(action==='toggle-signup-terms-consent-detail'){
    state.signupTermsConsentOpen = !state.signupTermsConsentOpen;
    render();
  }
  else if(action==='toggle-signup-consent'){
    state.signupConsent = !state.signupConsent;
    render();
  }
  else if(action==='toggle-signup-consent-detail'){
    state.signupConsentOpen = !state.signupConsentOpen;
    render();
  }
  else if(action==='confirm-signup'){
    const val = (id)=> { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
    const name = val('signup-name');
    const email = val('signup-email');
    const birth = val('signup-birth');
    const username = val('signup-username');
    const pw = val('signup-password');
    const nickname = val('signup-nickname');

    if(!name || !email || !birth || !username || !pw || !nickname){
      showToast(T('toastFillAll'));
      return;
    }
    if(!state.signupTermsConsent || !state.signupConsent){
      showToast(T('toastNeedConsent'));
      return;
    }
    if(!(window.__firebaseAuth && window.__firebaseAuth.ready)){
      showToast(T('toastFirebaseNotSet'));
      return;
    }
    window.__firebaseAuth.signUpWithEmail(email, pw, name).then(profile=>{
      const fullProfile = { ...profile, name, birth, username, nickname };
      window.storage.set('user-profile', JSON.stringify(fullProfile), false).catch(()=>{});
      if(window.__firebaseDB && window.__firebaseDB.ready){
        window.__firebaseDB.saveUserProfile(profile.uid, {
          name, email, birth, username, nickname, provider:'password',
          termsConsent:true, privacyConsent:true, consentAgreedAt:new Date().toISOString(),
        }).catch(err=>console.error('Firestore save failed:', err));
      }
      state.loggedIn = true;
      saveAuth();
      state.screen = 'main';
      render();
      showToast(T('toastSignupDone'));
    }).catch(err=>{
      console.error('Email sign-up failed:', err);
      if(err && err.code==='auth/email-already-in-use') showToast(T('toastEmailInUse'));
      else if(err && err.code==='auth/weak-password') showToast(T('toastWeakPassword'));
      else showToast(T('toastSignupFailed'));
    });
  }
  else if(action==='do-logout'){
    state.loggedIn=false; saveAuth(); state.screen='main'; render(); showToast(T('toastLogout'));
    if(window.__firebaseAuth && window.__firebaseAuth.ready){ window.__firebaseAuth.signOutOfGoogle().catch(()=>{}); }
  }
  else if(action==='open-settings'){ state.screen='settings'; render(); }
  else if(action==='go-contact'){ state.screen='contact'; render(); }
  else if(action==='do-email-contact'){
    openEmailContact('biblejournalingjoa@gmail.com', T('contactMailSubject'), T('contactMailBody'));
  }
  else if(action==='go-guide'){ state.screen='guide'; render(); }
  else if(action==='go-notifications'){ state.screen='notifications'; render(); }
  else if(action==='open-notif-day'){
    state.notifDayOpen = el.dataset.day;
    render();
  }
  else if(action==='close-notif-day'){
    state.notifDayOpen = null;
    render();
  }
  else if(action==='save-notif-day'){
    const d = el.dataset.day;
    const inp = document.getElementById('notif-time-input');
    notifSettings[d] = inp && inp.value ? inp.value : '07:00';
    saveNotifSettings();
    state.notifDayOpen = null;
    render();
  }
  else if(action==='turn-off-notif-day'){
    const d = el.dataset.day;
    notifSettings[d] = null;
    saveNotifSettings();
    state.notifDayOpen = null;
    render();
  }
  else if(action==='set-fontsize'){ state.fontSize = el.dataset.size; savePrefs(); render(); }
  else if(action==='set-lang'){ state.lang = el.dataset.lang; savePrefs(); render(); }
  else if(action==='set-theme'){ state.theme = el.dataset.theme; savePrefs(); render(); }
  else if(action==='go-today'){
    const m = state.purchased.length ? state.purchased[0] : 1;
    if(state.purchased.includes(m)){
      state.activeMonth = m;
      state.activeChapter = 1;
      state.screen = 'daily';
      state.activeTab = 'bible';
      state.highlightVerse = null;
      state.askOpen = false;
      render();
    } else {
      state.purchaseModal = m;
      state.selectedPlan = 'year';
      render();
      showToast(T('toastNeedPurchase', bookName(m)));
    }
  }
  else if(action==='open-purchase'){ state.purchaseModal = Number(el.dataset.month); state.selectedPlan='year'; render(); }
  else if(action==='close-purchase'){ state.purchaseModal=null; render(); }
  else if(action==='select-plan'){ state.selectedPlan = el.dataset.plan; render(); }
  else if(action==='confirm-purchase'){
    const m = Number(el.dataset.month);
    if(state.selectedPlan==='year'){
      BOOKS.forEach(b=>{ if(!state.purchased.includes(b.m)) state.purchased.push(b.m); });
    } else {
      if(!state.purchased.includes(m)) state.purchased.push(m);
    }
    savePurchased();
    state.purchaseModal=null;
    state.activeMonth=m;
    state.screen='chapters';
    render();
    showToast(state.selectedPlan==='year' ? T('toastPurchaseYear') : T('toastPurchaseMonth', bookName(m)));
  }
  else if(action==='open-chapters'){
    state.activeMonth = Number(el.dataset.month);
    state.screen='chapters';
    render();
  }
  else if(action==='go-chapters'){
    state.screen='chapters';
    render();
  }
  else if(action==='open-chapter'){
    state.activeMonth = Number(el.dataset.month);
    state.activeChapter = Number(el.dataset.chapter);
    state.screen='daily';
    state.activeTab='bible';
    state.highlightVerse=null;
    state.askOpen=false;
    render();
  }
  else if(action==='set-tab'){
    state.activeTab = el.dataset.tab;
    if(state.activeTab!=='bible') state.highlightVerse=null;
    render();
  }
  else if(action==='goto-verse'){
    state.activeTab='bible';
    state.highlightVerse = Number(el.dataset.verse);
    render();
  }
  else if(action==='toggle-ask'){
    state.askOpen = !state.askOpen;
    render();
  }
  else if(action==='pick-ask'){
    getEntry(ckey(state.activeMonth, state.activeChapter)).thought.askIndex = Number(el.dataset.index);
    state.askOpen = false;
    saveAnswersDebounced();
    render();
  }
  else if(action==='add-thanks'){
    getEntry(ckey(state.activeMonth, state.activeChapter)).thought.thanks.push('');
    saveAnswersDebounced();
    render();
  }
  else if(action==='go-groups'){
    state.screen='groups';
    render();
  }
  else if(action==='open-group'){
    state.activeGroupId = el.dataset.id;
    state.screen='group-room';
    render();
  }
  else if(action==='open-create-group'){
    state.createGroupOpen = true;
    render();
    requestAnimationFrame(()=>{
      const inp = document.getElementById('new-group-name');
      if(inp) inp.focus();
    });
  }
  else if(action==='close-create-group'){
    state.createGroupOpen = false;
    render();
  }
  else if(action==='confirm-create-group'){
    const inp = document.getElementById('new-group-name');
    const name = (inp && inp.value.trim()) || '새 그룹방';
    const g = {
      id:'g-'+Date.now(),
      name,
      color:GROUP_COLORS[groups.length % GROUP_COLORS.length],
      code:makeCode(),
      memberCount:2,
      messages:[{id:'m-'+Date.now(), from:'시스템', isMe:false, type:'system', text:'그룹방이 만들어졌어요. 링크로 초대해 함께 말씀을 나눠보세요.'}]
    };
    groups.push(g);
    saveGroups();
    state.createGroupOpen = false;
    state.activeGroupId = g.id;
    state.screen = 'group-room';
    render();
    showToast('그룹방이 만들어졌어요');
  }
  else if(action==='open-invite'){
    state.inviteGroupId = el.dataset.id;
    render();
  }
  else if(action==='close-invite'){
    state.inviteGroupId = null;
    render();
  }
  else if(action==='copy-invite' || action==='share-invite'){
    const link = el.dataset.link;
    try{
      navigator.clipboard && navigator.clipboard.writeText(link);
    }catch(err){}
    const channel = el.dataset.channel;
    showToast(channel ? `${channel} 공유 화면으로 연결하고 링크를 복사했어요` : '초대 링크가 복사되었어요');
  }
  else if(action==='open-share-picker'){
    state.shareGroupId = el.dataset.id;
    render();
  }
  else if(action==='close-share-picker'){
    state.shareGroupId = null;
    render();
  }
  else if(action==='open-image-viewer'){
    state.imageViewer = { msgId: el.dataset.msgid, index: Number(el.dataset.index) };
    render();
  }
  else if(action==='close-image-viewer'){
    state.imageViewer = null;
    render();
  }
  else if(action==='viewer-prev'){
    if(state.imageViewer) state.imageViewer.index = Math.max(0, state.imageViewer.index-1);
    render();
  }
  else if(action==='viewer-next'){
    if(state.imageViewer) state.imageViewer.index = state.imageViewer.index+1;
    render();
  }
  else if(action==='open-chapter-info'){
    state.chapterInfoOpen = true;
    render();
  }
  else if(action==='close-chapter-info'){
    state.chapterInfoOpen = false;
    render();
  }
  else if(action==='open-page-share'){
    state.pageShare = { kind: el.dataset.kind, step:'menu' };
    render();
  }
  else if(action==='close-page-share'){
    state.pageShare = null;
    render();
  }
  else if(action==='page-share-back'){
    state.pageShare.step = 'menu';
    render();
  }
  else if(action==='page-share-to-chat'){
    state.pageShare.step = 'pickGroup';
    render();
  }
  else if(action==='page-share-pick-group'){
    const gid = el.dataset.id;
    const g = getGroup(gid);
    const kind = state.pageShare.kind;
    if(!g || state.shareBusy) return;
    state.pageShare = null;
    state.shareBusy = true;
    render();
    showToast(T('shareGenerating'));
    const key = ckey(state.activeMonth, state.activeChapter);
    const label = `${bookName(state.activeMonth)} ${state.activeChapter}${state.lang==='en'?'':'장'}`;
    const html = kind==='content' ? buildContentSnapshotHTML(key) : buildThoughtSnapshotHTML(key);
    const cap = T('sharedImageCap', kind, label);
    captureSnapshotImage(html).then(dataUrl=>{
      pushMyMessage(g, { id:'m-'+Date.now(), from:'나', isMe:true, type:'image', imageData:dataUrl, jTitle:cap });
      state.shareBusy = false;
      render();
      showToast(T('shareDone'));
    }).catch(()=>{
      state.shareBusy = false;
      render();
      showToast(T('shareFailed'));
    });
  }
  else if(action==='page-share-kakao'){
    const kind = state.pageShare.kind;
    if(state.shareBusy) return;
    state.pageShare = null;
    state.shareBusy = true;
    render();
    showToast(T('shareGenerating'));
    const key = ckey(state.activeMonth, state.activeChapter);
    const label = `${bookName(state.activeMonth)} ${state.activeChapter}${state.lang==='en'?'':'장'}`;
    const html = kind==='content' ? buildContentSnapshotHTML(key) : buildThoughtSnapshotHTML(key);
    const filename = `${kind}-${key}.png`;
    captureSnapshotImage(html).then(async dataUrl=>{
      const shared = await shareImageNative(dataUrl, filename, T('sharedImageCap', kind, label));
      state.shareBusy = false;
      render();
      if(!shared){
        triggerImageDownload(dataUrl, filename);
        showToast(T('toastShareUnsupported'));
      }
    }).catch(()=>{
      state.shareBusy = false;
      render();
      showToast(T('shareFailed'));
    });
  }
  else if(action==='page-share-download'){
    const kind = state.pageShare.kind;
    if(state.shareBusy) return;
    state.pageShare = null;
    state.shareBusy = true;
    render();
    showToast(T('shareGenerating'));
    const key = ckey(state.activeMonth, state.activeChapter);
    const html = kind==='content' ? buildContentSnapshotHTML(key) : buildThoughtSnapshotHTML(key);
    captureSnapshotImage(html).then(dataUrl=>{
      triggerImageDownload(dataUrl, `${kind}-${key}.png`);
      state.shareBusy = false;
      render();
      showToast(T('toastDownloadDone'));
    }).catch(()=>{
      state.shareBusy = false;
      render();
      showToast(T('shareFailed'));
    });
  }
  else if(action==='do-share'){
    const gid = el.dataset.id;
    const kind = el.dataset.kind;
    const g = getGroup(gid);
    if(!g || state.shareBusy) return;
    state.shareGroupId = null;
    state.shareBusy = true;
    render();
    showToast(T('shareGenerating'));
    const key = ckey(state.activeMonth, state.activeChapter);
    const label = `${bookName(state.activeMonth)} ${state.activeChapter}${state.lang==='en'?'':'장'}`;

    if(kind==='both'){
      Promise.all([
        captureSnapshotImage(buildContentSnapshotHTML(key)),
        captureSnapshotImage(buildThoughtSnapshotHTML(key)),
      ]).then(([contentUrl, thoughtUrl])=>{
        pushMyMessage(g, {
          id:'m-'+Date.now(), from:'나', isMe:true, type:'image-pair',
          images:[
            { dataUrl:contentUrl, cap:T('sharedImageCap','content',label) },
            { dataUrl:thoughtUrl, cap:T('sharedImageCap','thought',label) },
          ],
          jTitle: T('shareBothName') + ' · ' + label,
        });
        state.shareBusy = false;
        render();
        showToast(T('shareDone'));
      }).catch(()=>{
        state.shareBusy = false;
        render();
        showToast(T('shareFailed'));
      });
      return;
    }

    const html = kind==='content' ? buildContentSnapshotHTML(key) : buildThoughtSnapshotHTML(key);
    const cap = T('sharedImageCap', kind, label);
    captureSnapshotImage(html).then(dataUrl=>{
      pushMyMessage(g, { id:'m-'+Date.now(), from:'나', isMe:true, type:'image', imageData:dataUrl, jTitle:cap });
      state.shareBusy = false;
      render();
      showToast(T('shareDone'));
    }).catch(()=>{
      state.shareBusy = false;
      render();
      showToast(T('shareFailed'));
    });
  }
  else if(action==='send-message'){
    const gid = el.dataset.id;
    const g = getGroup(gid);
    const inp = document.getElementById('chat-input');
    if(!g || !inp || !inp.value.trim()) return;
    pushMyMessage(g, {id:'m-'+Date.now(), from:'나', isMe:true, type:'text', text:inp.value.trim()});
    inp.value='';
    render();
  }
});

document.getElementById('shell').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target && e.target.id==='chat-input'){
    const gid = e.target.dataset.id;
    const g = getGroup(gid);
    if(!g || !e.target.value.trim()) return;
    pushMyMessage(g, {id:'m-'+Date.now(), from:'나', isMe:true, type:'text', text:e.target.value.trim()});
    e.target.value='';
    render();
  }
});

/* input handling — no full re-render, so focus/cursor is preserved */
document.getElementById('shell').addEventListener('input', (e)=>{
  const t = e.target;
  const kind = t.dataset.kind;
  if(!kind || !state.activeMonth || !state.activeChapter) return;
  const entry = getEntry(ckey(state.activeMonth, state.activeChapter));
  if(kind==='content'){
    entry.content[t.dataset.qid] = t.value;
  } else if(kind==='thought'){
    entry.thought[t.dataset.field] = t.value;
  } else if(kind==='thanks'){
    entry.thought.thanks[Number(t.dataset.index)] = t.value;
  }
  saveAnswersDebounced();
});

loadAll();
</script>
</body>
</html>
